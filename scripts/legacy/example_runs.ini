# Example batch file for generate_spaxel_map.py:
#
#     python generate_spaxel_map.py --config example_runs.ini
#
# Entries run top to bottom. Keys are the script's long options without the
# leading dashes ("run-name" and "run_name" both work), and every value is
# validated exactly as it would be on the command line.


# Inherited by every entry below. Anything an entry sets itself wins.
[DEFAULT]
source     = south
fitter     = twogauss
workers    = 8
palette    = light
scaling    = presentation


# A section named after an emission line fits that line. With nothing else
# set, it takes the defaults above, and its maps land in
#   plots/line_maps/[NeIII]/south_twogauss/
[[NeIII]]

[[NeII]]

# Per-entry overrides: this one gets the paper font scaling.
[[SIV]]
scaling = paper

# q3dfit needs fewer workers here because they are MPI ranks, not processes.
[[OIV]]
fitter  = q3dfit
workers = 4

# A section that sets `line` is a *labelled* run, so the same line can appear
# more than once. The label names the run, so these maps go to
#   plots/line_maps/[NeIII]/neiii_dark/
# instead of colliding with the [[NeIII]] entry above.
[neiii_dark]
line     = [NeIII]
palette  = dark
skip-fit = true          # re-render from the saved fit table; no refitting

# The north nucleus, kept apart by its run name.
[neii_north]
line     = [NeII]
source   = north
run-name = north_twogauss
