# Regenerates every emission line in fitparams.dat: south nucleus, the
# built-in two-Gaussian fitter, light palette, paper scaling.
#
#     python generate_spaxel_map.py --config south_twogaussian.ini
#
# Fit tables and FITS cubes land in   spaxs/<line>/
# Maps land in                        plots/line_maps/<line>/south_twogaussian/
#
# Every line refits from scratch -- there is no skip-fit here -- so this is a
# long run. Add `workers = N` below to cap the process pool; it defaults to
# every CPU. Entries run top to bottom, and a line that fails does not stop
# the ones behind it; failures are summarised at the end.

[DEFAULT]
source   = south
fitter   = twogauss
palette  = light
scaling  = paper
run-name = south_twogaussian
# workers = 8


# --- NIRSpec lines -------------------------------------------------------
# These sit below the MIRI/MRS short-wavelength cutoff (~4.7 um rest) and are
# covered by the g395h-f290lp cube instead, so they override the instrument.

[[KVII]]
instrument = NIRSpec

[[CaIV]]
instrument = NIRSpec

[[AlVI]]
instrument = NIRSpec

[Pfund85]
instrument = NIRSpec

[Brackett54]
instrument = NIRSpec

[[MgIV]]
instrument = NIRSpec

[[ArVI]]
instrument = NIRSpec


# --- MIRI/MRS lines ------------------------------------------------------
# Instrument defaults to MRS; the cube is picked from each line's channel and
# sub-channel in fitparams.dat.

[[FeII]]

[[ArII]]

# [MgVII] is blended with H2 0-0 S(7) at 5.5112 um, only ~435 km/s away and
# several times stronger, so its fit window is deliberately narrow (5.4995-
# 5.5072) and stops short of the H2 line. Expect detections in the brighter
# spaxels only, and treat any broad/offset second component with suspicion:
# the window is too narrow to constrain one (see fitparams.dat).
[[MgVII]]

[[MgV]]

[[H_2_S_5]]

[Pfund65]

[[NeVI]]

[[ArIII]]

[[H_2_S_3]]

[[SIV]]

[[H_2_S_2]]

[[NeII]]

[[NeV]_14]

[[NeIII]]

[[H_2_S_1]]

[[SIII]]

[[NeV]]

[[OIV]]
